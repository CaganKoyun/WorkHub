name: E2E

on:
  pull_request:
    paths:
      - "src/**"
      - "e2e/**"
      - "supabase/migrations/**"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.ts"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Secret'lar boş ise env-gated spec'ler (live-signup, qa-multi-profile)
      # kendi içlerinde test.skip yapıyor. Public smoke/ux-flows her koşulda
      # çalışır. Secret'ları GitHub → Settings → Secrets and variables →
      # Actions altında ekleyin.
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit path)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Report live-env status
        id: env-check
        run: |
          if [ -n "$VITE_SUPABASE_URL" ] && [ -n "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "has_env=true" >> $GITHUB_OUTPUT
            echo "::notice::Live Supabase env algılandı — Playwright suite koşulacak."
          else
            echo "has_env=false" >> $GITHUB_OUTPUT
            echo "::warning::VITE_SUPABASE_URL veya VITE_SUPABASE_PUBLISHABLE_KEY repo secret'ı yok. Playwright suite'i SKIP (uygulama Supabase env'siz render olmuyor). Ekle: Settings → Secrets and variables → Actions."
          fi

      - name: Apply pending Supabase migrations
        if: steps.env-check.outputs.has_env == 'true' && env.SUPABASE_ACCESS_TOKEN != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx supabase db push --project-ref "$VITE_SUPABASE_PROJECT_ID"

      - name: Run Playwright
        if: steps.env-check.outputs.has_env == 'true'
        run: npx playwright test --reporter=list,html

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results
          retention-days: 14
