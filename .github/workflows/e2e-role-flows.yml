name: E2E role flows

# Runs the role-flow Playwright spec against the seeded fixture users in
# whatever Supabase project the repo secrets point to. Requires:
#   VITE_SUPABASE_URL             (e.g. https://<ref>.supabase.co)
#   VITE_SUPABASE_PUBLISHABLE_KEY (sb_publishable_...)
# and the seed at supabase/seed/e2e-fixtures.sql already applied against
# that DB. If secrets are missing the job is a no-op (skipped step).

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "e2e/role-flows.spec.ts"
      - "supabase/seed/e2e-fixtures.sql"
      - ".github/workflows/e2e-role-flows.yml"

jobs:
  role-flows:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip if secrets not configured
        if: ${{ env.VITE_SUPABASE_URL == '' || env.VITE_SUPABASE_PUBLISHABLE_KEY == '' }}
        run: |
          echo "Supabase secrets not set on this repo — skipping."
          echo "Set VITE_SUPABASE_URL + VITE_SUPABASE_PUBLISHABLE_KEY in repo Settings → Secrets."
          exit 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run role-flow spec
        run: npx playwright test role-flows.spec.ts --reporter=list
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
