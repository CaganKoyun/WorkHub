name: E2E role flows

# Runs the role-flow Playwright spec against the seeded fixture users in
# whatever Supabase project the repo secrets point to. Requires:
#   VITE_SUPABASE_URL             (e.g. https://<ref>.supabase.co)
#   VITE_SUPABASE_PUBLISHABLE_KEY (sb_publishable_...)
# and the seed at supabase/seed/e2e-fixtures.sql already applied against
# that DB. If secrets are missing every downstream step is skipped —
# the job stays green so it doesn't block PRs before secrets are wired.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "e2e/role-flows.spec.ts"
      - "supabase/seed/e2e-fixtures.sql"
      - ".github/workflows/e2e-role-flows.yml"

jobs:
  role-flows:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - id: gate
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Supabase secrets not set — skipping role-flow run. Add VITE_SUPABASE_URL + VITE_SUPABASE_PUBLISHABLE_KEY under Settings → Secrets → Actions."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4
      - if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - if: steps.gate.outputs.run == 'true'
        run: npm ci
      - if: steps.gate.outputs.run == 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.gate.outputs.run == 'true'
        name: Run role-flow spec
        run: npx playwright test role-flows.spec.ts --reporter=list
      - if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
